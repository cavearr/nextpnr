# Regression gate: build a representative design set against THIS PR's
# himbaechel/xilinx code + openXC7 prjxray-db, and prove each result
# equivalent to the synthesis it came from.
#
# Why it exists: the openXC7 demo-projects CI builds against the
# toolchain-nix pin of nextpnr-xilinx, so a nextpnr PR never exercises the
# xc7 demos.  This workflow closes that gap for the PR itself.
#
# TIERS
#
#   essential -- small, fast designs plus the five demo projects.  Every
#     entry is proved and blocking.  This is the list that has to stay
#     green: between them they cover artix7, spartan7, kintex7 and virtex7,
#     both I/O banks, the clocking column, BRAM, carry and DSP.
#
#   stretch -- LiteX Linux-capable SoCs.  Large (tens of minutes of P&R),
#     not proved, and NON-BLOCKING (continue-on-error).  They exist to
#     catch the failures that only appear at scale: router congestion,
#     placer timeouts, and cell shapes no small design instantiates.  A
#     stretch failure is a bug report, not a merge blocker.
#
# WHY ONE PRJXRAY REVISION (this replaces the separate virtex7 workflow)
#
# The Virtex-7 designs used to live in their own workflow because
# fasm2frames at the old demos pin (ef5203e9) cannot assemble a Virtex-7
# design at all -- it has no tileinfo for the XC7V HCLK_IOI3 tiles and dies
# with KeyError: 'HCLK_IOI3_X82Y130'.  e1302fc6 handles virtex7 and is very
# nearly bit-identical on the older families: measured on this repo's own
# output, blinky-digilent-arty (artix7) and blinky-qmtech (kintex7) produce
# byte-identical frames under both revisions, and
# litex-ddr-qmtech-kintex7 differs in exactly 6 frames of one IOB column
# (0x00402F9D..0x00402FA7).  That difference is deliberate: e1302fc6's
# grid.py prefers a tile type's own segbits database over the alias path,
# because on IOB SING tiles the alias metadata names the wrong site and
# misplaces the words, silently corrupting neighbouring tiles' frames.  The
# kintex7 frames therefore moved with the pin, and the ones it produces now
# are the more correct ones.  One revision for every family is worth
# more than a bit-for-bit-frozen old one.
#
# 54fea88c moves on from ed3331c6 for the HP-bank glue: fasm2frames no
# longer injects OBUF_HP_BANK_GLUE on a half whose OLOGIC holds a cell
# (openXC7/prjxray#30), which is what lets the two VC707 LiteX stretch SoCs
# assemble once #72 registers their SD card tristates.  The revisions in
# between (#27 and #28: xc7frames2bit refuses frame addresses the part does
# not have and exits 1 when it cannot write the bitstream; #29: fuzzers
# only) give the same .bit as ed3331c6 for the 12 virtex7 and 2 kintex7
# entries of this gate.  litex-ddr-qmtech-kintex7 loses OMUX.D1 on its 44
# OSERDES halves (2 frames), a bit Vivado does not set there either.
#
# WHAT IS CHECKED
#
# Per-register equivalence, with lvs_equiv: the bitstream is read back into a
# fabric netlist and proved equal to the synthesis nextpnr was given, cone by
# cone.  This takes over from the sha256 of the frames, which was a poor
# instrument for the job and is kept only as a warning.  A hash detects that
# something moved; it cannot say whether what moved matters.  Placement is not canonical, the writer's feature order is
# not canonical, and any routing change moves bytes without changing logic --
# so every improvement to the placer broke the gate, and every break looked
# the same as damage.  Equivalence answers the question the hash was standing
# in for.
#
# Three consequences worth stating, because they are what the change buys:
#
#   * a different placement is not a failure.  The hash still notices and
#     says so as a warning; nothing needs re-recording for a build to pass,
#     and nothing needs a pinned RNG to be comparable.
#   * yosys need not be pinned.  A hash was hostage to the runner's apt
#     yosys; a proof is taken against whatever netlist that yosys produced,
#     so a package bump changes the measurement and not the verdict.
#   * a timeout is not a failure either.  EQUIV_TIMEOUT bounds each target at
#     ten minutes and reports what it could not discharge as blocked -- not
#     proved, for a known reason, which is a different statement from "these
#     two netlists differ".
#
# What it does NOT check is the memory contents behind a boundary cut: a block
# RAM, a DSP and a clock manager are cut at their pins, so what is proved is
# that both sides wired the same nets to the same places.  The contents are
# checked where they can be, against the bitstream, in fasm2netlist's own
# tests.
#
# SEEDS
#
# The demo projects pass --seed and the vc707 examples do not.  That was once
# load-bearing -- the goldens were made with the default RNG state, and
# passing --seed with the default VALUE is not equivalent, since
# DeterministicRNG() seeds rngstate directly while rngseed() also advances the
# generator five steps.  With the hashes gone it no longer decides anything;
# it is kept only so a run is reproducible while being debugged.

name: demos

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - ci/apt-cache-test

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Every comparison this gate makes is between sorted text -- IOB feature
  # sets, FASM lines, delta files -- and feature names mix '.' and '_' as
  # separators.  Those two characters collate in OPPOSITE orders under C
  # (where '.' 0x2E precedes '_' 0x5F) and under an en_*.UTF-8 collation,
  # so an unpinned locale makes a recorded reference mean one thing on the
  # machine that recorded it and another on the runner that checks it: the
  # VC707 IOB delta recorded under en_GB.UTF-8 reported adjacent lines as
  # moved, and diff misaligned the surrounding hunks badly enough to show
  # the same tile on both sides of the comparison at once.  Pin it for the
  # whole workflow rather than per script.
  LC_ALL: C
  # The placer settings the flow that produces WORKING HARDWARE uses.  Both
  # halves were established on the VC707 by flashing, not by reading reports.
  #
  # Eigen is the HeAP placer's linear solver, so its version IS a placer
  # setting.  5.0.1 and 3.4.0 diverge from the first solve of this SoC --
  # "wirelen solved" 61897 against 61907, and the spread from there -- and on
  # the VexRiscv-SMP Linux netlist the 5.0.1 placement comes out with dead
  # ethernet: the BIOS reaches netboot and reports "ARP failed", on three
  # separate CI builds.  Rebuilding that same netlist, same nextpnr commit,
  # same flags, against 3.4.0 reproduces the known-good bitstream EXACTLY --
  # 471754 features, zero differences, identical in original order -- and that
  # bitstream ARPs.  Nothing else distinguished them.
  #
  # 5.0.1 was pinned in 15cadd5c "for golden reproducibility".  The frames
  # hash it was protecting is a warning now, not a gate, so that reason is
  # gone; what the pin still did was ship gateware whose network is dead.
  #
  # --placer-heap-timingweight 60 is NEXTPNR_FLAGS in xc7-bitstream-tools'
  # Makefile, on every nextpnr invocation there.  On this SoC it moves
  # eth_tx_clk from 126.84 MHz -- a 1.5% margin over the 125 MHz it must make,
  # which is inside the noise of the timing model -- to 218.48 MHz.  A design
  # that only just passes is a design whose next placement may not.
  PNR_PLACER_FLAGS: --placer-heap-timingweight 60
  # Every P&R invocation below also passes `-o hold-fix`: after routing, fix any
  # hold-time (min-delay) violations by lengthening the short arc -- a routing
  # detour for small deficits, a feedthrough LUT for larger ones.  A no-op where
  # there are no violations, so it is on by default.  The tight-timing designs
  # the measured delay matrix packs are exactly the ones that grow hold problems.
  # Pinned to make the gate reproducible: the chipdb is generated from
  # prjxray-db and the frames from prjxray's fasm2frames, so a moving
  # database or tool revision would change what is measured.
  PRJXRAY_DB_REV: b12466df16ecb6fe194fe436ec020ac08d32d61e
  # virtex7-capable fasm2frames, used for every family; see header
  PRJXRAY_REV: 54fea88cc61b58b76a83d0be7b1194a5ec1d7d2d
  # demo-projects commit carrying the five pre-synthesized .json netlists
  # (yosys 0.67 synthesis outputs; the gate reuses them, no yosys needed
  # for those entries)
  DEMO_PROJECTS_REV: 2713a8eb5f94abcceb50431405e8733c61a0b270
  # The commit Eigen's 3.4.0 tag names (see "Install Eigen" below).  The
  # same value is in arch_ci.yml, which saves the cached checkout.
  EIGEN_COMMIT: 3147391d946bb4b6c68edd901f2add6ac1f31f8c

jobs:
  demos:
    name: ${{ matrix.tier }} / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.tier == 'stretch' }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test branch: two entries.  vc707-johnson installs yosys
          # from apt (source example, lvs).  blinky is a demo-project.
          # No stretch entry.
          # IBUFDS receiver + one BUFG that lands in a CLK_BUFG_TOP_R tile.
          # The reference case: xc7-bitstream-tools builds the same design
          # from its own checkout and gets a byte-identical FASM, and it is
          # the only entry with a legacy-flow feature set to compare to.
          - name: vc707-johnson
            tier: essential
            synth: -nobram
            lvs: true
            source: example
            design: vc707-johnson
            family: virtex7
            part: xc7vx485tffg1761-2
            die: xc7vx485t
            timeout: 90
            # Present so the steps that read them still type-check.  Empty,
            # so the netlist and block-RAM gates stay skipped.
            netlist: ""
            xdc: ""
            pnr_flags: ""
            fom_max_worst: ""
            fom_max_p95: ""
            lvs_blocked: ""
            lvs_blocked_differ: ""

          # Smallest artix7 end-to-end path.
          - name: blinky-digilent-arty
            tier: essential
            lvs: true
            source: demo-project
            project: blinky-digilent-arty
            top: blinky
            family: artix7
            upper: ARTIX7
            part: xc7a35tcsg324-1
            die: xc7a50t
            seed: 1
            timeout: 60
            netlist: ""
            xdc: ""
            pnr_flags: ""
            fom_max_worst: ""
            fom_max_p95: ""
            lvs_blocked: ""
            lvs_blocked_differ: ""

    steps:
      - uses: actions/checkout@v4
        with:
          path: nextpnr
          submodules: recursive

      - name: Checkout prjxray-db
        uses: actions/checkout@v4
        with:
          repository: openXC7/prjxray-db
          ref: ${{ env.PRJXRAY_DB_REV }}
          path: prjxray-db

      - name: Checkout prjxray (fasm2frames / xc7frames2bit)
        uses: actions/checkout@v4
        with:
          repository: openXC7/prjxray
          ref: ${{ env.PRJXRAY_REV }}
          path: prjxray
          submodules: recursive

      - name: Checkout demo-projects
        if: matrix.source == 'demo-project'
        uses: actions/checkout@v4
        with:
          repository: openXC7/demo-projects
          ref: ${{ env.DEMO_PROJECTS_REV }}
          path: demo-projects

      # actions/checkout writes files in index order, so a .v checked out a
      # second after its committed .json would look "older" to make and the
      # %.json rule would fire (needs yosys, which this job may not have).
      # Touch every committed .json so make always treats them as current.
      - name: Keep committed JSONs newer than sources
        if: matrix.source == 'demo-project'
        run: find demo-projects -name '*.json' -exec touch {} +

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same failure as arch_ci: a trickling Azure mirror never trips
      # Acquire::http::Timeout, so the download has its own cap and retries
      # on the next mirror.  The lists are unchanged.  pip is unchanged.
      - name: Apt cache key (build deps)
        id: apt-build-key
        timeout-minutes: 10
        run: nextpnr/.github/ci/apt-install.sh key nextpnr/.github/ci/apt-demos-build.list

      - name: Restore apt packages (build deps)
        id: apt-build-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-demos-build
          key: ${{ steps.apt-build-key.outputs.key }}
          restore-keys: |
            ${{ steps.apt-build-key.outputs.prefix-image }}
            ${{ steps.apt-build-key.outputs.prefix-os }}

      - name: Install build deps
        timeout-minutes: 35
        run: |
          nextpnr/.github/ci/apt-install.sh install nextpnr/.github/ci/apt-demos-build.list "${{ runner.temp }}/apt-demos-build"
          pip install fasm intervaltree progressbar2 simplejson pyyaml

      - name: Apt cache key (yosys)
        if: matrix.source == 'example' || matrix.lvs
        id: apt-yosys-key
        timeout-minutes: 10
        run: nextpnr/.github/ci/apt-install.sh key nextpnr/.github/ci/apt-demos-yosys.list

      - name: Restore apt packages (yosys)
        if: matrix.source == 'example' || matrix.lvs
        id: apt-yosys-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-demos-yosys
          key: ${{ steps.apt-yosys-key.outputs.key }}
          restore-keys: |
            ${{ steps.apt-yosys-key.outputs.prefix-image }}
            ${{ steps.apt-yosys-key.outputs.prefix-os }}

      - name: Install yosys
        if: matrix.source == 'example' || matrix.lvs
        timeout-minutes: 35
        run: nextpnr/.github/ci/apt-install.sh install nextpnr/.github/ci/apt-demos-yosys.list "${{ runner.temp }}/apt-demos-yosys"

      # Eigen is header-only; build it from a fixed gitlab tag.  placer_heap
      # solves a sparse system with Eigen's iterative solver whose numerics
      # differ between major versions, so which Eigen built a run decides the
      # placement it produces -- and therefore whether the gateware works.
      # 3.4.0 is not a conservative default here, it is the version proved on
      # hardware; see PNR_PLACER_FLAGS at the top of this file for the
      # measurements.  nextpnr uses find_package(Eigen3 NO_MODULE), so
      # CMAKE_PREFIX_PATH below makes this win over the system one.
      #
      # If this is ever moved again, move it because a BOARD was flashed, not
      # because a report looked better: the 5.0.1 placement passed every
      # timing check nextpnr makes and its ethernet was dead.
      #
      # The checkout comes from the Actions cache when it can, because
      # gitlab.com turns clones away under load ("GitLab is currently unable
      # to handle this request due to load") and every job here clones.  This
      # workflow never runs on a push to main (it runs on pull requests and by
      # hand), and a pull request can restore a cache saved on main but not one
      # saved by another pull request, so arch_ci.yml saves the same checkout
      # under the same key on push.  The tag, the URL and the commit are
      # unchanged: the commit is checked below, whichever way the checkout
      # arrived.
      - name: Cache the Eigen 3.4.0 checkout
        id: cache-eigen
        uses: actions/cache@v4
        with:
          path: /tmp/eigen
          key: cache-eigen-3.4.0-${{ env.EIGEN_COMMIT }}-r1

      - name: Clone Eigen 3.4.0
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        run: |
          # Three more tries, a minute apart: the longest wait seen from a
          # refusal to the next clone that went through was under three
          # minutes.  A fourth refusal fails the job.
          for try in 1 2 3 4; do
            git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git /tmp/eigen && break
            if [ "$try" = 4 ]; then exit 1; fi
            sleep 60
          done

      - name: Install Eigen 3.4.0 (the version proved on hardware)
        run: |
          head=$(git -C /tmp/eigen rev-parse HEAD)
          echo "Eigen checkout: $head"
          if [ "$head" != "$EIGEN_COMMIT" ]; then
            echo "::error::Eigen checkout is $head, not 3.4.0 ($EIGEN_COMMIT)"
            exit 1
          fi
          cmake -S /tmp/eigen -B /tmp/eigen-build \
            -DCMAKE_INSTALL_PREFIX=/tmp/eigen-install \
            -DBUILD_TESTING=OFF -DEIGEN_BUILD_BLAS=OFF -DEIGEN_BUILD_LAPACK=OFF
          cmake --install /tmp/eigen-build

      # The xc7vx485t .bba is ~345 MB and takes the bulk of a virtex7 job's
      # wall time to generate.  It depends only on the generator, the
      # constids and the pinned database, so key the cache on exactly those.
      - name: Chipdb cache key
        id: chipdb-key
        run: |
          # Hash EVERY generator file, not just the entry point: xilinx_gen.py
          # imports xilinx_device, filters and parse_sdf, and xilinx_device
          # imports tileconn.  Keying on xilinx_gen.py alone meant a change to
          # any of the others restored a .bba built by the old generator, so
          # the job ran a current binary against a stale chipdb.
          h=$(cat nextpnr/himbaechel/uarch/xilinx/gen/*.py \
                  nextpnr/himbaechel/uarch/xilinx/constids.inc | sha256sum | cut -c1-16)
          echo "key=${{ matrix.die }}-bba-${{ env.PRJXRAY_DB_REV }}-$h" >> "$GITHUB_OUTPUT"

      - name: Cache chipdb .bba
        uses: actions/cache@v4
        with:
          path: build/himbaechel/uarch/xilinx/chipdb-${{ matrix.die }}.bba
          key: ${{ steps.chipdb-key.outputs.key }}

      - name: Build nextpnr-himbaechel from this PR
        run: |
          cmake -S nextpnr -B build \
            -DARCH=himbaechel -DHIMBAECHEL_UARCH=xilinx \
            -DBUILD_GUI=OFF -DBUILD_PYTHON=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/eigen-install \
            -DHIMBAECHEL_PRJXRAY_DB="$GITHUB_WORKSPACE/prjxray-db" \
            -DHIMBAECHEL_XILINX_DEVICES="${{ matrix.die }}"
          free -h
          cmake --build build --parallel 4
          free -h
          mkdir -p bin
          cp build/nextpnr-himbaechel bin/
          cp nextpnr/.github/scripts/nextpnr-xilinx-shim.sh bin/nextpnr-xilinx
          chmod +x bin/nextpnr-xilinx
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      # LVS needs an extractor.  Only built where it is used: a design large
      # enough to matter takes over an hour to extract, so the eligible set is
      # the small ones.
      - name: Build fasm2netlist
        if: matrix.lvs
        run: |
          # lvs_equiv links CaDiCaL from fasm2netlist's own third_party/cadical submodule (the recursive checkout brings it); without it, libz3.
          cmake -S nextpnr/3rdparty/fasm2netlist -B build-f2n -DCMAKE_BUILD_TYPE=Release
          cmake --build build-f2n --target tileverilog lvs_equiv --parallel 4

      - name: Build prjxray tools
        run: |
          cd prjxray
          # fixes for building the unmaintained project with modern cmake/gcc
          # (mirrors openXC7/toolchain-nix nix/prjxray.nix)
          sed -i 's/VERSION 3.5.0/VERSION 3.14.0/g' CMakeLists.txt
          sed -i 's/VERSION 3.0.2/VERSION 3.14.0/g' third_party/gflags/CMakeLists.txt
          sed -i 's/VERSION 2.8.12/VERSION 3.14.0/g' third_party/cctz/CMakeLists.txt
          CFLAGS="-include stdint.h -Wno-free-nonheap-object" \
          CXXFLAGS="-include stdint.h -Wno-free-nonheap-object" \
            cmake -S . -B build-prjxray -DCMAKE_BUILD_TYPE=Release
          cmake --build build-prjxray --target xc7frames2bit --parallel 4
          cp build-prjxray/tools/xc7frames2bit "$GITHUB_WORKSPACE/bin/"
          cp "$GITHUB_WORKSPACE/nextpnr/.github/scripts/fasm2frames-shim.sh" \
             "$GITHUB_WORKSPACE/bin/fasm2frames"
          chmod +x "$GITHUB_WORKSPACE/bin/fasm2frames"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/prjxray" >> "$GITHUB_ENV"

      # ---------------- source: example ----------------

      - name: Synthesize, place and route (example)
        if: matrix.source == 'example'
        env:
          EX: nextpnr/himbaechel/uarch/xilinx/examples/${{ matrix.design }}
        run: |
          mapfile -t sources < <(find "$EX" -maxdepth 1 -name '*.v' -print | sort)
          # -flatten -abc9 is what xc7-bitstream-tools' verify_examples.sh
          # synthesises with, and the LVS proof depends on both: without
          # -flatten the logic hides inside a submodule the comparison cannot
          # traverse, and without -abc9 the mapper emits MUXF7/MUXF8 trees.
          #
          # -nobram is per-design and NOT a default.  It keeps a small example
          # in LUTs where that is what it means to exercise; a design that
          # means to use block RAM leaves it off, and anything inferring a ROM
          # -- every LiteX SoC's BIOS -- would be forced into LUTs by it.
          yosys -p "read_verilog -lib +/xilinx/cells_sim.v; \
                    read_verilog ${sources[*]}; \
                    synth_xilinx -flatten -abc9 ${{ matrix.synth }} -arch xc7 -top top; \
                    write_json ${{ matrix.name }}.json"
          # An example may be in the gate precisely because it does NOT
          # build: a minimal reproducer for a defect is worth more pinned
          # than deleted.  Those carry a recorded P&R failure, and the job
          # FAILS either way -- a design the flow cannot build must not
          # report green, because a green tick is a claim that it can.  What
          # the record buys is which failure it is: still the known defect,
          # something new, or gone (which means it is fixed and the record
          # should be deleted).  Three outcomes, three messages, all red.
          # GitHub runs steps with bash -e but NOT pipefail, so `if cmd |
          # tee log` tests tee's status and a failing cmd reads as success.
          # Every known-failure branch below depends on seeing the real one.
          set -o pipefail
          known="nextpnr/.github/references/${{ matrix.name }}.pnr-known-failure"
          # no --seed here on purpose; see the SEEDS note in the header
          if ./build/nextpnr-himbaechel \
               --device ${{ matrix.part }} \
               -o xdc="$EX/top.xdc" \
               --json "${{ matrix.name }}.json" \
               -o fasm="${{ matrix.name }}.fasm" \
               ${{ matrix.lvs && format('-o placement={0}_placement.json', matrix.name) || '' }} \
               --router router2 -o hold-fix $PNR_PLACER_FLAGS 2>&1 | tee pnr.log; then
            if [ -f "$known" ]; then
              echo "::error::${{ matrix.name }} now places and routes, but a known"
              echo "P&R failure is still recorded in $known.  If the defect is"
              echo "fixed, delete that file so the design is gated on again."
              exit 1
            fi
          else
            if [ -f "$known" ] && grep -qFf "$known" pnr.log; then
              # The record says WHICH failure this is.  It does not excuse it:
              # a design that does not build is a red job, because a green one
              # states that the flow can build it.  What the record buys is
              # the distinction between "still the defect we know" and
              # "something else broke", which is the difference between the
              # two error messages here.
              echo "::error::${{ matrix.name }}: DOES NOT BUILD.  This is its recorded"
              echo "P&R failure, reproduced exactly -- not a new regression:"
              echo "  $(grep -m1 -Ff "$known" pnr.log)"
              echo "See the matrix entry in this file for the defect and what closing it needs."
              exit 1
            fi
            echo "::error::place and route failed for ${{ matrix.name }}"
            tail -20 pnr.log
            exit 1
          fi

      # ---------------- source: demo-project ----------------

      - name: Build demo project
        if: matrix.source == 'demo-project'
        env:
          UPPER: ${{ matrix.upper }}
          SEED: ${{ matrix.seed }}
        run: |
          export ${UPPER}_CHIPDB="$GITHUB_WORKSPACE/chipdb"
          mkdir -p "$GITHUB_WORKSPACE/chipdb"
          # openXC7.mk resolves the chipdb as <part-minus-speed>.bin; our
          # build produces chipdb-<die>.bin.  Copy under the expected name.
          cp "build/share/himbaechel/xilinx/chipdb-${{ matrix.die }}.bin" \
             "$GITHUB_WORKSPACE/chipdb/$(echo '${{ matrix.part }}' | sed 's/-[0-9]L\?$//').bin"
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          export PRJXRAY_DB_DIR="$GITHUB_WORKSPACE/prjxray-db"
          export PRJXRAY_DIR="$GITHUB_WORKSPACE/prjxray"
          # prove which binary the demos use
          command -v nextpnr-xilinx
          case "$(command -v nextpnr-xilinx)" in
            "$GITHUB_WORKSPACE/bin/"*) ;;
            *) echo "::error::gate is not using this PR's nextpnr-himbaechel"; exit 1 ;;
          esac
          PLACEMENT=""
          if [ -n "${{ matrix.lvs }}" ]; then
            PLACEMENT="-o placement=$GITHUB_WORKSPACE/${{ matrix.name }}_placement.json"
          fi
          # ONE invocation, with ONE set of PNR_ARGS.  This step used to run
          # make twice -- once for .frames carrying the placement dump, then
          # again for `all` without it -- which was harmless only because the
          # second run found everything up to date.  Any staleness at all and
          # P&R re-runs without the dump, leaving the LVS step to compare a
          # placement file against frames produced by a different run: a
          # mismatched-artefact comparison whose verdict means nothing.
          # `all` is ${TOP}.bit, which pulls .frames and .fasm anyway.
          #
          # A demo project can also be in the gate BECAUSE it does not build,
          # on the same terms as the examples above: the failure is recorded,
          # the job fails, and the record says which failure it is.
          set -o pipefail
          known="nextpnr/.github/references/${{ matrix.name }}.pnr-known-failure"
          if make -C "demo-projects/${{ matrix.project }}" all \
                  PNR_ARGS="--seed $SEED $PLACEMENT -o hold-fix $PNR_PLACER_FLAGS" 2>&1 | tee build.log; then
            if [ -f "$known" ]; then
              echo "::error::${{ matrix.name }} now builds, but a known P&R"
              echo "failure is still recorded in $known.  If the defect is"
              echo "fixed, delete that file so the design is gated on again."
              exit 1
            fi
          else
            if [ -f "$known" ] && grep -qFf "$known" build.log; then
              # The record says WHICH failure this is.  It does not excuse it:
              # a design that does not build is a red job, because a green one
              # states that the flow can build it.  What the record buys is
              # the distinction between "still the defect we know" and
              # "something else broke", which is the difference between the
              # two error messages here.
              echo "::error::${{ matrix.name }}: DOES NOT BUILD.  This is its recorded"
              echo "P&R failure, reproduced exactly -- not a new regression:"
              echo "  $(grep -m1 -Ff "$known" build.log)"
              echo "See the matrix entry in this file for the defect and what closing it needs."
              exit 1
            fi
            echo "::error::build failed for ${{ matrix.name }}"
            tail -30 build.log
            exit 1
          fi
          cp "demo-projects/${{ matrix.project }}/${{ matrix.top }}.fasm" "${{ matrix.name }}.fasm"
          cp "demo-projects/${{ matrix.project }}/${{ matrix.top }}.frames" "${{ matrix.name }}.frames"

      # ---------------- source: litex-linux (stretch) ----------------

      # ---------------- source: netlist (stretch) ----------------

      - name: Place and route (netlist)
        if: matrix.source == 'netlist'
        env:
          EX: nextpnr/himbaechel/uarch/xilinx/examples/${{ matrix.design }}
        run: |
          set -o pipefail
          gunzip -c "$EX/${{ matrix.netlist }}" > "${{ matrix.name }}.json"

          # A netlist whose memories are uninitialised routes and configures
          # indistinguishably from a good one and then does nothing on
          # hardware, so check before spending an hour placing it.
          python - "${{ matrix.name }}.json" <<'EOF'
          import json, re, sys
          d = json.load(open(sys.argv[1]))
          hexre = re.compile(r'^[0-9a-fA-F]+$')
          real = 0
          for m in d["modules"].values():
              for c in m.get("cells", {}).values():
                  for k, v in c.get("parameters", {}).items():
                      if re.match(r'^INIT(_[0-9A-F]{2})?$', k) and isinstance(v, str):
                          t = v.replace(" ", "")
                          if hexre.match(t) and set(t) != {"0"}:
                              real += 1
          print("INIT words with real content:", real)
          if real == 0:
              sys.exit("::error::netlist carries no initialised memory; its "
                       "ROM is empty and the SoC would boot into nothing")
          EOF

          # --timing-allow-fail: what this tier answers is whether P&R
          # completes and yields assemblable FASM, not what Fmax it reaches.
          # The number is printed so a regression is visible, not gated on.
          #
          # An entry may override the gate-wide placer flags.  One does:
          # vc707-litex-linux-1gb is the design that historically MISSED its
          # DDR clock constraint, and it needs the measured delay matrix and a
          # higher timing weight to meet it.  Everything else takes
          # PNR_PLACER_FLAGS unchanged.
          ENTRY_PNR_FLAGS="${{ matrix.pnr_flags }}"
          [ -n "$ENTRY_PNR_FLAGS" ] || ENTRY_PNR_FLAGS="$PNR_PLACER_FLAGS"
          echo "placer flags: $ENTRY_PNR_FLAGS"
          ./build/nextpnr-himbaechel \
            --device ${{ matrix.part }} \
            -o xdc="$EX/${{ matrix.xdc }}" \
            --json "${{ matrix.name }}.json" \
            -o fasm="${{ matrix.name }}.fasm" \
            -o placement="${{ matrix.name }}_placement.json" \
            --router router2 --timing-allow-fail -o hold-fix $ENTRY_PNR_FLAGS 2>&1 | tee pnr.log
          grep -E "Max frequency|Device utilisation" -A12 pnr.log | tail -25 || true

      # Placement quality, for an entry whose failure on the board was its
      # block RAM placement rather than anything nextpnr reports.  The score
      # (bram_fom.py) is each block RAM's worst estimated read path to the
      # registers it feeds.  The worst score is the test: every placement that
      # read its ROM on the board scored 5995 ps or less, the two that did not
      # 6251 and 6961, and the limit sits between; the p95 limit is a backstop.  It also insists that the
      # clock-tree model and the block RAM pass ran, since a run without them
      # is the configuration that failed.
      - name: Block RAM placement figure of merit
        if: matrix.fom_max_worst
        env:
          EX: nextpnr/himbaechel/uarch/xilinx/examples/${{ matrix.design }}
        run: |
          set -o pipefail
          # The lines each pass logs when it ran, not the prefixes: a model
          # without rates for the die logs "clock-tree: no clock delays
          # measured for ...", and the pass it gates "bram-place: no clock
          # delays measured ...", and neither of those is the configuration
          # the budget was measured under.
          for want in "clock-tree: ${{ matrix.die }}, [0-9]+ clock region rows" \
                      "bram-place: [0-9]+ block RAMs in [0-9]+ read-mux groups"; do
            if ! grep -Eq "$want" pnr.log; then
              echo "::error::no '$want' line in the P&R log: the clock-tree model or the block RAM pass did not run"
              exit 1
            fi
          done
          grep -E "clock-tree: |bram-place: " pnr.log
          python nextpnr/.github/scripts/bram_fom.py \
            --netlist "${{ matrix.name }}.json" \
            --tilegrid "prjxray-db/${{ matrix.family }}/${{ matrix.die }}/tilegrid.json" \
            --delay-matrix "$EX/delay-matrix-xc7vx485t.txt" \
            --max-worst ${{ matrix.fom_max_worst }} --max-p95 ${{ matrix.fom_max_p95 }} \
            "${{ matrix.name }}=${{ matrix.name }}_placement.json"

      # ---------------- common: assemble ----------------

      # An entry may produce FASM the database cannot assemble.  Those are
      # recorded rather than hidden.  NOTE this branch still passes on a
      # reproduced failure, unlike the P&R records above, which now fail:
      # nothing currently uses it, and it should be brought into line the
      # first time something does.
      - name: FASM to frames to bitstream
        if: matrix.source != 'demo-project' && env.PNR_KNOWN_FAILURE != '1'
        env:
          PYTHONPATH: ${{ github.workspace }}/prjxray
        run: |
          set -o pipefail   # see the note in the place-and-route step
          known="nextpnr/.github/references/${{ matrix.name }}.fasm2frames-known-failure"
          if python prjxray/utils/fasm2frames.py \
               --part ${{ matrix.part }} \
               --db-root prjxray-db/${{ matrix.family }} \
               "${{ matrix.name }}.fasm" "${{ matrix.name }}.frames" 2>&1 | tee f2f.log; then
            if [ -f "$known" ]; then
              echo "::error::fasm2frames now succeeds for ${{ matrix.name }}, but a known"
              echo "failure is still recorded in $known.  If the defect is fixed, delete"
              echo "that file so the design is assembled and proved like the rest."
              exit 1
            fi
          else
            if [ -f "$known" ] && grep -qFf "$known" f2f.log; then
              echo "known defect reproduced: $(cat "$known")"
              echo "KNOWN_FAILURE=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::fasm2frames failed for ${{ matrix.name }}"
            tail -20 f2f.log
            exit 1
          fi
          ./prjxray/build-prjxray/tools/xc7frames2bit \
            --part_file "prjxray-db/${{ matrix.family }}/${{ matrix.part }}/part.yaml" \
            --part_name ${{ matrix.part }} \
            --frm_file "${{ matrix.name }}.frames" \
            --output_file "${{ matrix.name }}.bit"

      # ---------------- common: verify ----------------

      # Stretch entries are not proved: they are large enough that their
      # placement is not worth freezing, and the point of running them is
      # that they complete at all.
      # The frames hash, kept as a WARNING and not a gate.
      #
      # It is a drift detector and nothing more: it fires when the output moves
      # and cannot say whether the movement matters.  Placement is not
      # canonical, feature order is not canonical, and a routing change moves
      # bytes without changing logic -- so as a gate it failed on every placer
      # improvement and every failure looked like damage.  Equivalence decides
      # that question now; this just says the bytes changed, which is worth
      # knowing and worth nobody's build.
      #
      # A stale hash is therefore expected after any deliberate change, and
      # several are stale now: the examples' synthesis moved to -flatten -abc9
      # when the proofs went in.  Re-record when convenient; nothing depends
      # on it.
      - name: Frames hash, for information
        if: always() && env.PNR_KNOWN_FAILURE != '1'
        continue-on-error: true
        run: |
          f="${{ matrix.name }}.frames"
          gf="nextpnr/.github/goldens/${{ matrix.name }}.sha256"
          [ -s "$f" ] || { echo "no frames produced; nothing to compare"; exit 0; }
          hash=$(sha256sum "$f" | cut -d' ' -f1)
          if [ ! -f "$gf" ]; then
            echo "::notice::${{ matrix.name }}: no recorded hash; this run is $hash"
            exit 0
          fi
          golden=$(cat "$gf")
          if [ "$hash" != "$golden" ]; then
            echo "::warning::${{ matrix.name }}: frames moved -- got $hash, recorded $golden."
            echo "Not a failure: equivalence is checked separately.  To adopt this run:"
            echo "  echo $hash > .github/goldens/${{ matrix.name }}.sha256"
          else
            echo "frames hash unchanged: $hash"
          fi

      # LVS: prove the extracted netlist equivalent to the synthesis it came
      # from, per register, with lvs_equiv.
      #
      # A frames hash detects drift but cannot tell drift from damage --
      # placement is not canonical and a routing change moves bytes without
      # changing logic.  This decides the question a hash cannot, which is
      # why it runs under always(): output that moved is exactly when it matters.
      #
      # The flow is xc7-bitstream-tools' scripts/verify_examples.sh, which is
      # the reference for it.
      # No always() here.  A proof needs a netlist to prove, so if an earlier
      # step did not produce one there is nothing to say: running anyway
      # turned a failed build into "blocked -- extraction from the bitstream
      # failed", which reads like a modelling gap and hides the real error.
      #
      # An entry the LVS cannot prove yet, for a reason it can name, carries
      # lvs_blocked (the reason) and lvs_blocked_differ (how many differ that
      # reason leaves, as measured).  It passes only at that count: a proof
      # means the entry should go, fewer differ mean the count should come
      # down, more mean a new difference -- each one fails, so it is noticed.
      # lvs_blocked without its count fails too, since it would let any count
      # through.
      - name: LVS equivalence against the synthesis
        if: matrix.lvs && env.PNR_KNOWN_FAILURE != '1'
        env:
          EX: nextpnr/himbaechel/uarch/xilinx/examples/${{ matrix.design }}
          TILEVERILOG: ${{ github.workspace }}/build-f2n/tileverilog
          LVS_EQUIV: ${{ github.workspace }}/build-f2n/lvs_equiv
          PRJXRAY_DB: ${{ github.workspace }}/prjxray-db
          EQUIV_TIMEOUT: 600
          EXPECT_BLOCKED: ${{ matrix.lvs_blocked }}
          EXPECT_DIFFER: ${{ matrix.lvs_blocked_differ }}
        run: |
          # Each source keeps its netlist and constraints in its own place:
          # an example synthesises them into the workspace, a demo project
          # ships them committed.
          case "${{ matrix.source }}" in
            example)
              gold="${{ matrix.name }}.json"
              xdc="$EX/top.xdc"
              top=top ;;
            demo-project)
              gold="demo-projects/${{ matrix.project }}/${{ matrix.top }}.json"
              xdc="demo-projects/${{ matrix.project }}/${{ matrix.top }}.xdc"
              top="${{ matrix.top }}" ;;
            *)
              echo "::error::no LVS inputs defined for source ${{ matrix.source }}"; exit 1 ;;
          esac
          # Exit 77 is the script's "blocked" verdict: not proved, for a
          # reason it can name -- an unsupported primitive, or the proof not
          # finishing inside EQUIV_TIMEOUT.  That is a different statement
          # from "these netlists differ", and it must not fail the gate, so
          # it is translated here.  Calling the script bare made every
          # blocked design a red job, which would also have hit the large
          # LiteX projects at the ten-minute bound.
          set +e
          nextpnr/.github/scripts/lvs-equiv.sh \
            "${{ matrix.name }}" "lvs-${{ matrix.name }}" \
            "${{ matrix.name }}.fasm" "${{ matrix.name }}_placement.json" \
            "$gold" "$xdc" \
            "${{ matrix.part }}" "${{ matrix.die }}" "${{ matrix.family }}" "$top"
          rc=$?
          set -e
          if [ "$rc" = 77 ]; then
            echo "::notice::${{ matrix.name }}: LVS blocked, see the reason above -- not a failure"
            exit 0
          fi
          exit "$rc"

      # Runs even when the hash gate failed: when the frames move, the first
      # thing worth knowing is whether the HP-bank feature set moved with
      # them.  Only vc707-johnson has an external reference to compare
      # against -- the same design built by the legacy nextpnr-xilinx flow.
      - name: HP-bank parity against the legacy flow
        if: always() && matrix.name == 'vc707-johnson' && env.PNR_KNOWN_FAILURE != '1'
        run: nextpnr/.github/scripts/check-vc707-iob-parity.sh "${{ matrix.name }}.fasm"

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.fasm
            ${{ matrix.name }}.bit
          if-no-files-found: warn

  # Clean runner.  Both apt lists the demos job installs (build deps and
  # yosys).  pip is not part of the package set.  Test branch only.
  Dpkg-today:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - name: Show apt mirror list and archive
      run: |
        echo "apt-mirrors.txt:"
        cat /etc/apt/apt-mirrors.txt
        echo "archives:"
        ls -la /var/cache/apt/archives
    - name: Install
      timeout-minutes: 45
      run: |
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y git make cmake libboost-all-dev python3-dev
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y yosys
    - name: Record installed packages
      run: dpkg-query -W -f '${Package} ${Version}\n' > dpkg-query.txt
    - uses: actions/upload-artifact@v4
      with:
        name: dpkg-today-demos
        path: dpkg-query.txt

  # Both lists through the script, on a clean runner.
  Dpkg-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
    - name: Show apt mirror list and archive
      run: |
        echo "apt-mirrors.txt:"
        cat /etc/apt/apt-mirrors.txt
        echo "archives before restore:"
        ls -la /var/cache/apt/archives
    - name: Apt cache key (build deps)
      id: apt-build-key
      timeout-minutes: 10
      run: .github/ci/apt-install.sh key .github/ci/apt-demos-build.list

    - name: Restore apt packages (build deps)
      id: apt-build-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/apt-demos-build
        key: ${{ steps.apt-build-key.outputs.key }}
        restore-keys: |
          ${{ steps.apt-build-key.outputs.prefix-image }}
          ${{ steps.apt-build-key.outputs.prefix-os }}

    - name: Install build deps
      timeout-minutes: 35
      run: .github/ci/apt-install.sh install .github/ci/apt-demos-build.list "${{ runner.temp }}/apt-demos-build"

    - name: Apt cache key (yosys)
      id: apt-yosys-key
      timeout-minutes: 10
      run: .github/ci/apt-install.sh key .github/ci/apt-demos-yosys.list

    - name: Restore apt packages (yosys)
      id: apt-yosys-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/apt-demos-yosys
        key: ${{ steps.apt-yosys-key.outputs.key }}
        restore-keys: |
          ${{ steps.apt-yosys-key.outputs.prefix-image }}
          ${{ steps.apt-yosys-key.outputs.prefix-os }}

    - name: Install yosys
      timeout-minutes: 35
      run: .github/ci/apt-install.sh install .github/ci/apt-demos-yosys.list "${{ runner.temp }}/apt-demos-yosys"
    - name: Record installed packages
      run: dpkg-query -W -f '${Package} ${Version}\n' > dpkg-query.txt
    - uses: actions/upload-artifact@v4
      with:
        name: dpkg-script-demos
        path: dpkg-query.txt
